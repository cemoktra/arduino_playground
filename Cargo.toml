[package]
name = "arduino-playground"
version = "0.1.0"
authors = ["Bastian Schubert <bastian.schubert@dock.financial>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "arduino-playground"
test = false
bench = false

[dependencies]
arduino-hal = { git = "https://github.com/rahix/avr-hal", features = [
    "arduino-uno",
] }
panic-halt = "1.0.0"
ufmt = "0.2.0"
nb = "1.1.0"
embedded-hal = "1.0.0"

[build-dependencies]
proc-macro2 = "1.0.95"
embedded-hal = "1.0"

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
